<script>

const MONTHS={JANUARI:1,JANUARY:1,FEBRUARI:2,FEBRUARY:2,MAC:3,MARCH:3,APRIL:4,MEI:5,MAY:5,JUN:6,JUNE:6,JULAI:7,JULY:7,OGOS:8,AUGUST:8,SEPTEMBER:9,OKTOBER:10,OCTOBER:10,NOVEMBER:11,DISEMBER:12,DECEMBER:12};
async function parseTimetablePdf(pdf){
  const tokens=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    for(const it of tc.items){
      const s=it.str||''; if(!s.trim()) continue;
      const x0=it.transform[4], y=it.transform[5], w=it.width||0, L=s.length||1;
      const re=/\S+/g; let m;
      while((m=re.exec(s))){ const a=x0+w*m.index/L, b=x0+w*(m.index+m[0].length)/L; tokens.push({t:m[0],x:(a+b)/2,y,p}); }
    }
  }
  // group into lines (page order, then top-down)
  tokens.sort((a,b)=>a.p-b.p||b.y-a.y||a.x-b.x);
  const lines=[];
  for(const tk of tokens){
    let ln=lines.find(l=>l.p===tk.p&&Math.abs(l.y-tk.y)<3);
    if(!ln){ln={p:tk.p,y:tk.y,toks:[]};lines.push(ln);}
    ln.toks.push(tk);
  }
  lines.sort((a,b)=>a.p-b.p||b.y-a.y);
  lines.forEach(l=>l.toks.sort((a,b)=>a.x-b.x));
  const isTime=t=>/^\d{1,2}[:.]\d{2}$/.test(t), isCode=t=>/^\d{5}$/.test(t);
  const titles=[]; const tables=[]; let cur=null; const warnings=[];
  for(const l of lines){
    const words=l.toks.map(k=>k.t), up=words.join(' ').toUpperCase();
    if(/JADUAL|KOMUTER/.test(up)) titles.push(words.join(' '));
    const trainToks=l.toks.filter(k=>/^\d{3,5}$/.test(k.t));
    if(/\bTREN\b|\bTRAIN\b/.test(up) && trainToks.length>=2){
      const cols=trainToks.map(k=>({x:k.x,no:k.t}));
      const gaps=cols.slice(1).map((c,i)=>c.x-cols[i].x).sort((a,b)=>a-b);
      cur={cols,tol:(gaps[Math.floor(gaps.length/2)]||40)*0.45,rows:[]}; tables.push(cur); continue;
    }
    if(!cur) continue;
    const times=l.toks.filter(k=>isTime(k.t));
    if(!times.length) continue;
    const name=l.toks.filter(k=>!isTime(k.t)&&!isCode(k.t)).map(k=>k.t).join(' ').trim();
    if(!name){warnings.push('A row of times had no station name and was skipped.');continue;}
    const row={};
    for(const k of times){
      let best=null,bd=1e9; cur.cols.forEach((c,i)=>{const d=Math.abs(c.x-k.x); if(d<bd){bd=d;best=i;}});
      if(bd>cur.tol){warnings.push(name+': time '+k.t+' did not line up with any train column.');continue;}
      if(row[best]) warnings.push(name+': two times under train '+cur.cols[best].no+'.');
      row[best]=k.t.replace('.',':');
    }
    cur.rows.push({name:name.toUpperCase().replace(/\s+/g,' '),row});
  }
  const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
  const out=tables.filter(t=>t.rows.length).map((t,ti)=>{
    const stations=t.rows.map(r=>r.name);
    const trains=t.cols.map((c,i)=>({no:c.no,times:t.rows.map(r=>r.row[i]||'')})).filter(tr=>tr.times.filter(Boolean).length>=2);
    trains.forEach(tr=>{let prev=-1;tr.times.forEach((x,i)=>{if(!x)return;const m=toMin(x);if(m<prev)warnings.push('Train '+tr.no+' goes back in time at '+stations[i]+' ('+x+'). Check the PDF.');prev=m;});});
    return {name:stations[0]+' → '+stations[stations.length-1],stations,trains};
  });
  const title=titles.join(' ');
  let effective='';
  const dm=title.toUpperCase().match(/(\d{1,2})\s+([A-Z]+)\s+(\d{4})/);
  if(dm&&MONTHS[dm[2]]) effective=dm[3]+'-'+String(MONTHS[dm[2]]).padStart(2,'0')+'-'+dm[1].padStart(2,'0');
  const U=title.toUpperCase();
  const service=/HUJUNG MINGGU|WEEKEND|CUTI|SABTU|AHAD/.test(U)?'weekend':'weekday';
  // station order: longest table first, then merge others
  const order=[];
  [...out].sort((a,b)=>b.stations.length-a.stations.length).forEach(t=>t.stations.forEach(s=>{if(!order.includes(s))order.push(s);}));
  const first=out[0]; if(first){const fo=first.stations; order.sort((a,b)=>{const ia=fo.indexOf(a),ib=fo.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib);});}
  return {title:titles[0]||'',service,effective,stations:order,tables:out,warnings:[...new Set(warnings)].slice(0,30),trainCount:out.reduce((n,t)=>n+t.trains.length,0)};
}


const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=n=>({"KL SENTRAL":"KL Sentral","UKM":"UKM","MIDVALLEY":"Mid Valley"}[n]||String(n).toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()));
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
const fmtDur=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=d=>{if(!d)return '—';const[y,m,dd]=d.split('-');return +dd+' '+MON[+m-1]+' '+y;};
const fmtStamp=iso=>{try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kuala_Lumpur',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));}catch(e){return iso||'';}};
const SVC={weekday:'Weekdays',weekend:'Weekends & holidays'};

const S={db:null,user:null,assets:null,canEdit:false,revs:[],revMap:{},live:{},loaded:false,slow:false,dbMissing:false,
  rider:{svc:null,openNo:null,folds:{},foldKey:''},names:{},

function nowKL(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kuala_Lumpur',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short',hourCycle:'h23'}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;const min=+g('hour')*60+ +g('minute');return{min,sec:min*60+ +g('second'),wd:g('weekday')};
}
const view=()=>location.hash==='#admin'?'admin':'rider';

/* ---------------- Rider view ---------------- */
function liveRev(svc){const id=S.live[svc];return id&&S.revMap[id]?S.revMap[id]:null;}
function trips(rev,from,to){
  const out=[];
  rev.tables.forEach(tb=>{const a=tb.stations.indexOf(from),b=tb.stations.indexOf(to);if(a<0||b<0||b<=a)return;
    tb.trains.forEach(tr=>{const d=tr.times[a],r=tr.times[b];if(d&&r)out.push({no:tr.no,dep:d,arr:r,stops:tb.stations.map((s,i)=>[s,tr.times[i]]).filter(x=>x[1]),from,to});});});
  return out.sort((x,y)=>toMin(x.dep)-toMin(y.dep));
}
/* live onboard tracker */
const tripKey=x=>x?(x.manual?'m|':'')+x.no+'|'+x.from+'|'+x.to:'';
function findTrain(no){
  const R=S.rider,svcs=[R.svc,...['weekday','weekend'].filter(s=>s!==R.svc)];
  for(const svc of svcs){const rev=liveRev(svc);if(!rev)continue;
    for(const tb of rev.tables){const tr=tb.trains.find(t=>t.no===no);if(tr)return{svc,stops:tb.stations.map((s,i)=>[s,tr.times[i]]).filter(x=>x[1])};}}
  return null;
}
const EARLY=30*60; // a manual train can be tracked from 30 min before it departs
function manualTrip(nowSec){
  const m=S.rider.manual;if(!m)return null;
  const f=findTrain(m.no);if(!f)return{missing:true};
  const st=f.stops,last=st[st.length-1],sec=t=>toMin(t)*60;
  if(nowSec>=sec(last[1]))return{ended:true,last};
  if(nowSec<sec(st[0][1])-EARLY)return{early:true,first:st[0]};
  let to=last[0];const ti=st.findIndex(s=>s[0]===m.to);if(ti>0&&sec(st[ti][1])>nowSec)to=m.to;
  return{no:m.no,dep:st[0][1],arr:st.find(s=>s[0]===to)[1],stops:st,from:st[0][0],to,manual:true};
}
function onboardTrip(nowSec){
  const R=S.rider;
  if(R.manual){
    const t=manualTrip(nowSec);
    if(t&&t.no){R.candidates=[];return t;}
    if(t&&t.ended)R.manualMsg={kind:'ok',text:'Train '+R.manual.no+' finished its run at '+nice(t.last[0])+' ('+t.last[1]+').'};
    R.manual=null;saveManual();
  }
  if(!R.todayRuns||!R.list)return null;
  const c=R.list.filter(x=>toMin(x.dep)*60<=nowSec&&nowSec<toMin(x.arr)*60);
  R.candidates=c;
  const live=c.filter(x=>tripKey(x)!==R.dismissed);
  if(!live.length)return null;
  return live.find(x=>x.no===R.pickNo)||live[live.length-1];
}
function mmss(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),r=s%60;return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m?m+' min '+String(r).padStart(2,'0')+' s':r+' s';}
function trackerHtml(x,nowSec){
  const st=x.stops.map(s=>({name:s[0],t:s[1],sec:toMin(s[1])*60}));
  const a=st.findIndex(s=>s.name===x.from),b=st.findIndex(s=>s.name===x.to);
  const seg=st.slice(a,b+1);
  let pi=0;seg.forEach((s,i)=>{if(s.sec<=nowSec)pi=i;});
  const prev=seg[pi],next=seg[Math.min(pi+1,seg.length-1)],dest=seg[seg.length-1];
  const atStation=nowSec-prev.sec<60;
  const toNext=next.sec-nowSec,span=Math.max(60,next.sec-prev.sec);
  const frac=atStation?0:Math.min(1,Math.max(0,(nowSec-prev.sec)/span));
  const tripFrac=Math.min(1,Math.max(0,(nowSec-seg[0].sec)/Math.max(60,dest.sec-seg[0].sec)));
  const stopsLeft=seg.length-1-pi, end=x.stops[x.stops.length-1][0];
  const arriving=!atStation&&toNext<=60;
  let lbl,now;
  if(nowSec<prev.sec){lbl='Waiting to depart · leaves '+prev.t;now=esc(nice(prev.name));}
  else if(atStation&&pi===0){lbl='Departing';now=esc(nice(prev.name));}
  else if(atStation){lbl='Stopped at';now=esc(nice(prev.name));}
  else if(arriving){lbl='Arriving at';now=esc(nice(next.name));}
  else{lbl='Between stations';now=esc(nice(prev.name))+' → '+esc(nice(next.name));}
  const nextIsDest=next===dest;
  const alt=(S.rider.candidates||[]).filter(c=>c.no!==x.no);
  return '<div class="tk-top"><span class="live"><i></i>Live · on board'+(x.manual?' · set by you':'')+'</span><span class="tk-train"><b class="tno">Train '+esc(x.no)+'</b> to '+esc(nice(end))+'</span></div>'+
    '<div class="tk-status"><span class="lbl">'+lbl+'</span><div class="tk-now">'+now+'</div></div>'+
    '<div class="tk-count">'+(nextIsDest?'Your stop, ':'Next stop ')+esc(nice(next.name))+' in '+mmss(toNext)+' <small>· due '+next.t+'</small></div>'+
    '<div class="leg"><div class="end"><span>Previous</span><strong>'+esc(nice(prev.name))+'</strong><em>'+prev.t+'</em></div>'+
      '<div class="track" role="progressbar" aria-label="Progress to next station" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(frac*100)+'"><b style="width:'+(frac*100).toFixed(1)+'%"></b><span class="train" style="left:'+(frac*100).toFixed(1)+'%"></span></div>'+
      '<div class="end r"><span>Next</span><strong>'+esc(nice(next.name))+'</strong><em>'+next.t+'</em></div></div>'+
    '<div class="trip"><div class="tbar"><b style="width:'+(tripFrac*100).toFixed(1)+'%"></b></div><div class="facts"><span>'+esc(nice(seg[0].name))+' '+seg[0].t+'</span><span>'+stopsLeft+' stop'+(stopsLeft===1?'':'s')+' to '+esc(nice(dest.name))+' · '+mmss(dest.sec-nowSec)+' left</span><span>'+esc(nice(dest.name))+' '+dest.t+'</span></div></div>'+
    '<div class="tk-alt">'+(alt.length?'On a different train? '+alt.map(c=>'<button class="btn sm" type="button" data-pick="'+esc(c.no)+'">Train '+esc(c.no)+' ('+c.dep+')</button>').join(''):'')+'<button class="btn sm" type="button" data-hide-tracker>Not on board</button></div>';
}
function wireTracker(){
  const el=$('tracker');if(!el)return;
  el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.rider.pickNo=b.dataset.pick;S.rider.dismissed=null;renderRider();});
  const h=el.querySelector('[data-hide-tracker]');if(h)h.onclick=()=>{const R=S.rider;if(R.trip&&R.trip.manual){R.manual=null;saveManual();}else R.dismissed=tripKey(R.trip);renderRider();};
}
/* manual train entry */
function manualBox(inTracker){
  const R=S.rider,msg=R.manualMsg?'<div class="msg '+(R.manualMsg.kind==='err'?'err':'ok')+'" role="status">'+esc(R.manualMsg.text)+'</div>':'';
  if(!R.manualOpen) return '<div class="mbox">'+msg+'<div class="mrow"><button class="btn sm" type="button" id="m-open">'+(inTracker?'Wrong train? Enter train number':'On a train? Enter its number to track it')+'</button>'+
    '</div></div>';
  return '<form class="mbox" id="m-form" autocomplete="off"><label for="m-no">Train number you\'re on</label>'+
    '<div class="mrow"><input id="m-no" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="e.g. 2041" value="'+esc(R.manualDraft||'')+'">'+
    '<button class="btn sm accent" type="submit">Track this train</button><button class="btn sm" type="button" id="m-cancel">Cancel</button></div>'+msg+
    '<span class="muted" style="font-size:13px">The number is on the departure board and the train\'s front display. Your selected destination is used if the train stops there.</span></form>';
}
function submitManual(raw){
  const R=S.rider,no=String(raw||'').replace(/\D/g,'');R.manualDraft=no;
  if(!no){R.manualMsg={kind:'err',text:'Type the train number, e.g. 2041.'};renderRider();return;}
  const f=findTrain(no);
  if(!f){R.manualMsg={kind:'err',text:'Train '+no+' isn\'t in the live timetable. Check the number on the platform display.'};renderRider();return;}
  const prev=R.manual;R.manual={no,to:$('to')?.value||'',day:dayKL()};
  const t=manualTrip(nowKL().sec);
  if(!t.no){
    R.manual=prev;
    R.manualMsg={kind:'err',text:t.ended?'Train '+no+' already finished today at '+nice(t.last[0])+' ('+t.last[1]+').':'Train '+no+' leaves '+nice(t.first[0])+' at '+t.first[1]+'. You can start tracking it 30 minutes before.'};
    renderRider();return;
  }
  saveManual();R.dismissed=null;R.manualOpen=false;R.manualMsg=null;R.manualDraft='';
  if(f.svc!==R.svc)R.svc=f.svc;
  renderRider();window.scrollTo(0,0);
}
function wireManual(){
  const R=S.rider;
  const o=$('m-open');if(o)o.onclick=()=>{R.manualOpen=true;R.manualMsg=null;renderRider();const i=$('m-no');if(i)i.focus();};
  const c=$('m-cancel');if(c)c.onclick=()=>{R.manualOpen=false;R.manualMsg=null;R.manualDraft='';renderRider();};
  const f=$('m-form');if(f)f.onsubmit=e=>{e.preventDefault();submitManual($('m-no').value);};
  const i=$('m-no');if(i)i.oninput=()=>{R.manualDraft=i.value;};
}
/* where a train is now: index of its last stop reached, and whether it is still standing there */
function trainPos(stops,nowSec){
  const sec=stops.map(s=>toMin(s[1])*60);
  if(nowSec<sec[0]||nowSec>=sec[sec.length-1])return null;
  let i=0;sec.forEach((v,k)=>{if(v<=nowSec)i=k;});
  return{i,at:nowSec-sec[i]<60};
}
function tick(){
  if(view()!=='rider'||(!S.rider.list&&!S.rider.manual))return;
  const {sec}=nowKL();const t=onboardTrip(sec);
  if(tripKey(t)!==tripKey(S.rider.trip)){if(!busyUI())renderRider();return;}
  if(t){const el=$('tk-body');if(el){el.innerHTML=trackerHtml(t,sec);wireTracker();}}
}

const ICONS={pin:'<path d="M12 21s-6-5.6-6-11a6 6 0 1 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',list:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'};
function fold(key,icon,title,sub,inner){

  return '<section class="fold'+(open?' open':'')+'"><button class="fold-h" type="button" data-fold="'+key+'" aria-expanded="'+open+'" aria-controls="fold-'+key+'">'+
    '<span class="fold-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[icon]+'</svg></span>'+
    '<span class="fold-t"><strong>'+esc(title)+'</strong><span>'+esc(sub)+'</span></span>'+
    '<svg class="chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>'+
    '<div class="fold-b" id="fold-'+key+'"'+(open?'':' hidden')+'>'+inner+'</div></section>';
}
function renderRider(){
  const app=$('app');
  const prevFrom=$('from')?.value, prevTo=$('to')?.value, past=$('showPast')?.checked??!!saved.past;
  const {min:now,sec:nowSec,wd}=nowKL(); const weekendDay=wd==='Sat'||wd==='Sun';
  const svcs=['weekday','weekend'].filter(s=>liveRev(s));
  if(!S.rider.svc||!svcs.includes(S.rider.svc)) S.rider.svc=svcs.includes(weekendDay?'weekend':'weekday')?(weekendDay?'weekend':'weekday'):svcs[0]||null;
  const rev=S.rider.svc?liveRev(S.rider.svc):null;
  const adminLink=S.canEdit?'<a href="#admin">Manage timetables</a>':'';
  if(!rev){
    app.innerHTML='<div class="wrap"><section class="board"><div><div class="eyebrow">KTM Komuter · Seremban Line</div><h1>'+
      (S.dbMissing?'Timetable unavailable':S.loaded?'No timetable published yet':'Loading timetable…')+'</h1></div><div class="next"><div class="sub">'+
      (S.dbMissing?'The saved timetable can\'t be reached from this view. Open the page while signed in to claude.ai.':S.loaded?'An editor needs to upload a timetable PDF and make it live.':S.slow?'The timetable is taking longer than usual to load. It will appear when the connection returns.':'Fetching the live schedule.')+
      '</div></div></section><footer>'+adminLink+'</footer></div>';
    return;
  }
  const stations=rev.stations;
  let from=prevFrom||saved.from, to=prevTo||saved.to;
  if(!stations.includes(from)) from=stations.includes('KAJANG')?'KAJANG':stations[0];
  if(!stations.includes(to)) to=stations.includes('KL SENTRAL')?'KL SENTRAL':stations[stations.length-1];
  const opts=sel=>stations.map(s=>'<option value="'+esc(s)+'"'+(s===sel?' selected':'')+'>'+esc(nice(s))+'</option>').join('');
  const svcBtns=svcs.length>1?'<div class="svc" role="group" aria-label="Service days">'+svcs.map(s=>'<button type="button" data-svc="'+s+'" aria-pressed="'+(s===S.rider.svc)+'">'+SVC[s]+'</button>').join('')+'</div>':'';
  const mismatch=(S.rider.svc==='weekday'&&weekendDay)||(S.rider.svc==='weekend'&&!weekendDay);
  const todayRuns=!mismatch;
  try{localStorage.setItem('komuter-pair',JSON.stringify({from,to,past}));}catch(e){}

  let nextHtml='',rowsHtml='';
  const R=S.rider; if(R.pairKey!==from+'|'+to){R.pairKey=from+'|'+to;R.dismissed=null;R.pickNo=null;}
  R.list=null;R.todayRuns=todayRuns;R.trip=null;
  if(from===to){rowsHtml='<div class="empty">Choose a different destination.</div>';R.trip=onboardTrip(nowSec);}
  else{
    const list=trips(rev,from,to);
    R.list=list;R.trip=onboardTrip(nowSec);
    if(tripKey(R.trip)!==R.foldKey){R.foldKey=tripKey(R.trip);R.folds={};}
    const upcoming=list.filter(x=>toMin(x.dep)>=now);
    const nxt=todayRuns?upcoming[0]:null;
    if(!list.length) nextHtml='<div class="sub">No direct train runs between these stations on this timetable.</div>';
    else if(nxt){const w=toMin(nxt.dep)-now;nextHtml='<div><div class="eyebrow">Next train</div><div class="big">'+nxt.dep+'</div></div><div class="sub"><b class="tno">Train '+esc(nxt.no)+'</b> '+(w===0?'Leaving now':'in '+fmtDur(w))+' · arrives '+nxt.arr+'<br>'+(upcoming.length-1)+' more today</div>';}
    else nextHtml='<div><div class="eyebrow">First train'+(todayRuns?' tomorrow':'')+'</div><div class="big">'+list[0].dep+'</div></div><div class="sub"><b class="tno">Train '+esc(list[0].no)+'</b> '+(todayRuns?'No more trains today · ':'')+list.length+' trains a day</div>';
    const trow=(x,mode)=>{
      const isPast=mode==='today'&&todayRuns&&toMin(x.dep)<now, isNext=mode==='today'&&nxt&&x===nxt, w=toMin(x.dep)-now, open=S.rider.openNo===x.no+mode;
      const a=x.stops.findIndex(s=>s[0]===from), b=x.stops.findIndex(s=>s[0]===to), end=x.stops[x.stops.length-1][0];
      const onb=mode==='today'&&R.trip&&R.trip.no===x.no;
      const wait=mode==='tomorrow'?'tmrw':!todayRuns?'':onb?'now':isPast?'left':w<=0?'now':w<120?w+'m':Math.floor(w/60)+'h '+(w%60)+'m';
      // where this train is right now (only for today's running trains)
      const pos=mode==='today'&&todayRuns?trainPos(x.stops,nowSec):null;
      const where=pos?'<span class="where"><i class="dot" aria-hidden="true"></i>'+(pos.at?'At '+esc(nice(x.stops[pos.i][0])):esc(nice(x.stops[pos.i][0]))+' → '+esc(nice(x.stops[pos.i+1][0])))+'</span>':'';
      let barDot='';
      if(pos&&a>=0&&b>a){const sa=toMin(x.stops[a][1])*60,sb=toMin(x.stops[b][1])*60;
        if(nowSec>=sa&&nowSec<=sb)barDot='<i class="pos" style="left:'+(((nowSec-sa)/Math.max(60,sb-sa))*100).toFixed(1)+'%"></i>';}
      const stopLi=(s,i)=>{const here=pos&&pos.at&&pos.i===i;
        return '<li class="'+(i===a||i===b?'end':(i<a||i>b?'off':''))+(here?' here':'')+'"><span>'+s[1]+'</span><span>'+(here?'<i class="dot" aria-hidden="true"></i>':'')+esc(nice(s[0]))+(here?' <small>train is here</small>':'')+'</span></li>'+
          (pos&&!pos.at&&pos.i===i?'<li class="moving"><span></span><span><i class="dot" aria-hidden="true"></i><small>train is between stops</small></span></li>':'');};
      return '<div class="item'+(onb?' onboard':isPast?' past':'')+(isNext?' is-next':'')+'"><button class="row" type="button" data-no="'+esc(x.no+mode)+'" aria-expanded="'+open+'">'+
        '<span class="t">'+x.dep+'</span><span class="mid"><span class="bar">'+barDot+'</span><span class="dur">'+fmtDur(toMin(x.arr)-toMin(x.dep))+(onb?'<span class="pill green">On board</span>':'')+(isNext?'<span class="pill">Next</span>':'')+'</span><span class="train"><b class="tno">Train '+esc(x.no)+'</b>to '+esc(nice(end))+'</span>'+where+'</span>'+
        '<span class="t arr">'+x.arr+'</span><span class="wait">'+wait+'</span></button>'+
        '<div class="stops"'+(open?'':' hidden')+'><ol>'+x.stops.map(stopLi).join('')+'</ol></div></div>';
    };
    const wkNext={Mon:'Tue',Tue:'Wed',Wed:'Thu',Thu:'Fri',Fri:'Sat',Sat:'Sun',Sun:'Mon'}[wd];
    const tmrwWeekend=wkNext==='Sat'||wkNext==='Sun';
    const tmrwRuns=S.rider.svc==='weekend'?tmrwWeekend:!tmrwWeekend;
    if(!list.length) rowsHtml='<div class="empty">Trains on this timetable don\'t cover both stations. Try changing at KL Sentral or Mid Valley.</div>';
    else if(past||!todayRuns) list.forEach(x=>rowsHtml+=trow(x,'today'));
    else {

let pdfReady=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s);});}
function loadPdfJs(){
  if(!pdfReady) pdfReady=loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js').then(()=>loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')).catch(e=>{pdfReady=null;throw e;});
  return pdfReady;
}
async function handleFile(file){
  const A=S.admin;
  if(!file) return;
  if(!/pdf$/i.test(file.type)&&!/\.pdf$/i.test(file.name)){A.msg={kind:'err',text:'That file isn\'t a PDF. Choose the timetable PDF published by KTM.'};renderAdmin();return;}
  A.busy=true;A.msg={kind:'info',text:'Reading '+file.name+'…'};A.parsed=null;A.file=file;renderAdmin();
  try{
    await loadPdfJs();
    const buf=await file.arrayBuffer();
    const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    const r=await parseTimetablePdf(pdf);
    if(!r.trainCount){A.msg={kind:'err',text:'No train columns were found. The PDF needs a "NOMBOR TREN" row with train numbers and station rows with times, like the current KTM layout.'};A.file=null;}
    else{A.parsed=r;A.msg=null;}
  }catch(e){A.msg={kind:'err',text:'Couldn\'t read that PDF ('+(e.message||e)+'). If it\'s a scanned image rather than text, it can\'t be read automatically.'};A.file=null;}
  A.busy=false;renderAdmin();
}
async function saveRevision(){
  const A=S.admin,r=A.parsed;if(!r||A.busy)return;
  const label=$('f-label').value.trim(), eff=$('f-eff').value, svc=$('f-svc').value, makeLive=$('f-live').checked;
  if(!eff){A.msg={kind:'err',text:'Add the date this timetable takes effect.'};renderAdmin();return;}
  A.busy=true;A.msg={kind:'info',text:'Saving…'};renderAdmin();
  try{
    let assetId=null;
    if(S.assets){try{const up=await S.assets.upload(A.file);assetId=up.id;}catch(e){}}
    const n=S.revs.reduce((m,x)=>Math.max(m,x.n||0),0)+1;
    const uid=S.user&&S.user.id?await S.user.id():(S.localMode?'local':null);
    const id='r'+n+'-'+Date.now().toString(36);
    await S.db.doc('revisions/'+id).set({n,title:r.title,label:label||('Revision '+n),service:svc,effective:eff,fileName:A.file.name,assetId,uploadedAt:new Date().toISOString(),uploadedBy:uid,stations:r.stations,tables:r.tables,trainCount:r.trainCount,warnings:r.warnings});
    if(makeLive){const live={...S.live,[svc]:id,updatedAt:new Date().toISOString()};await S.db.doc('config/live').set(live);}
    const prev=S.revs.filter(x=>x.service===svc).sort((a,b)=>b.n-a.n)[0];
    A.parsed=null;A.file=null;
    A.msg={kind:'ok',text:'Saved as revision '+n+(makeLive?' and made live.':'.')+(assetId||S.localMode?'':' The PDF itself couldn\'t be stored, but the times were saved.')+(S.localMode?' Saved in this browser only. Export timetable.json to publish it.':'')};
    if(prev){A.cmpOld=prev._id;A.cmpNew=id;}
  }catch(e){A.msg={kind:'err',text:'Save failed: '+(e.code==='quota_exceeded'?'storage is full, delete an old revision first.':(e.message||e.code||e))};}
  A.busy=false;renderAdmin();
}
async function setLive(id){
  const r=S.revMap[id];if(!r)return;
  try{await S.db.doc('config/live').set({...S.live,[r.service]:id,updatedAt:new Date().toISOString()});S.admin.msg={kind:'ok',text:'Revision '+r.n+' is now the live '+SVC[r.service].toLowerCase()+' timetable.'};}
  catch(e){S.admin.msg={kind:'err',text:'Couldn\'t change the live timetable: '+(e.message||e.code)};}
  renderAdmin();
}
async function delRev(id){
  const r=S.revMap[id];if(!r)return;
  try{await S.db.doc('revisions/'+id).delete();if(r.assetId&&S.assets){try{await S.assets.delete(r.assetId);}catch(e){}}S.admin.msg={kind:'ok',text:'Revision '+r.n+' deleted.'};}
  catch(e){S.admin.msg={kind:'err',text:'Couldn\'t delete: '+(e.message||e.code)};}
  S.admin.confirmDel=null;renderAdmin();
}
function trainIndex(rev){const m={};rev.tables.forEach(tb=>tb.trains.forEach(tr=>{const st={};tb.stations.forEach((s,i)=>{if(tr.times[i])st[s]=tr.times[i];});m[tr.no]={no:tr.no,dir:tb.name,st,first:tb.stations.find((s,i)=>tr.times[i]),last:[...tb.stations].reverse().find((s,i)=>tr.times[tb.stations.length-1-i])};}));return m;}
function diffRevs(a,b,station){
  const A=trainIndex(a),B=trainIndex(b),out={added:[],removed:[],changed:[]};
  const touches=t=>!station||t.st[station];
  for(const no in B){if(!A[no]){if(touches(B[no]))out.added.push(B[no]);continue;}
    const o=A[no],n=B[no],keys=[...new Set([...Object.keys(o.st),...Object.keys(n.st)])];
    const order=b.stations.concat(a.stations.filter(s=>!b.stations.includes(s)));keys.sort((x,y)=>order.indexOf(x)-order.indexOf(y));
    const ch=keys.filter(k=>o.st[k]!==n.st[k]&&(!station||k===station)).map(k=>({s:k,o:o.st[k],n:n.st[k]}));
    if(ch.length)out.changed.push({no,dir:n.dir,ch});}
  for(const no in A) if(!B[no]&&touches(A[no])) out.removed.push(A[no]);
  const sa=new Set(a.stations),sb=new Set(b.stations);
  out.stAdded=b.stations.filter(s=>!sa.has(s));out.stRemoved=a.stations.filter(s=>!sb.has(s));
  return out;
}
function renderCompare(){
  const A=S.admin,revs=[...S.revs].sort((x,y)=>y.n-x.n);
  if(revs.length<2) return '<p class="muted">Upload a second timetable to compare revisions.</p>';
  if(!A.cmpNew||!S.revMap[A.cmpNew]) A.cmpNew=revs[0]._id;
  if(!A.cmpOld||!S.revMap[A.cmpOld]||A.cmpOld===A.cmpNew) A.cmpOld=(revs.find(r=>r._id!==A.cmpNew&&r.service===S.revMap[A.cmpNew].service)||revs.find(r=>r._id!==A.cmpNew))._id;
  const o=S.revMap[A.cmpOld],n=S.revMap[A.cmpNew];
  const opt=sel=>revs.map(r=>'<option value="'+r._id+'"'+(r._id===sel?' selected':'')+'>Rev '+r.n+' · '+esc(SVC[r.service])+' · from '+fmtDate(r.effective)+'</option>').join('');
  const allSt=n.stations.concat(o.stations.filter(s=>!n.stations.includes(s)));
  const d=diffRevs(o,n,A.cmpStation);
  let h='<div class="cmpgrid"><div class="field"><label for="c-old">Old schedule</label><select id="c-old">'+opt(A.cmpOld)+'</select></div><div class="arrow">→</div><div class="field"><label for="c-new">New schedule</label><select id="c-new">'+opt(A.cmpNew)+'</select></div></div>'+
    '<div class="field" style="max-width:280px"><label for="c-st">Only changes at</label><select id="c-st"><option value="">All stations</option>'+allSt.map(s=>'<option value="'+esc(s)+'"'+(s===A.cmpStation?' selected':'')+'>'+esc(nice(s))+'</option>').join('')+'</select></div>';
  if(o.service!==n.service) h+='<div class="msg warnlist">These revisions are for different service days ('+SVC[o.service]+' vs '+SVC[n.service]+'), so most differences are expected.</div>';
  h+='<div class="stats"><span class="chip mod">'+d.changed.length+' retimed</span><span class="chip add">+'+d.added.length+' new trains</span><span class="chip del">−'+d.removed.length+' removed</span>'+
    (d.stAdded.length?'<span class="chip add">+'+d.stAdded.length+' stations</span>':'')+(d.stRemoved.length?'<span class="chip del">−'+d.stRemoved.length+' stations</span>':'')+'</div>';
  if(d.stAdded.length) h+='<div class="msg ok">New stations: '+d.stAdded.map(s=>esc(nice(s))).join(', ')+'</div>';
  if(d.stRemoved.length) h+='<div class="msg err">Stations dropped: '+d.stRemoved.map(s=>esc(nice(s))).join(', ')+'</div>';
  if(!d.changed.length&&!d.added.length&&!d.removed.length){h+='<p class="muted">No train times differ'+(A.cmpStation?' at '+esc(nice(A.cmpStation)):'')+'.</p>';return h;}
  const dirs=[...new Set([...d.changed.map(x=>x.dir),...d.added.map(x=>x.dir),...d.removed.map(x=>x.dir)])];
  dirs.forEach(dir=>{
    h+='<div class="dir">'+esc(dir.split(' → ').map(nice).join(' → '))+'</div>';
    d.added.filter(x=>x.dir===dir).forEach(t=>{h+='<div class="chg"><h3>Train '+esc(t.no)+'<span class="chip add">New</span></h3><ul><li><span>'+esc(nice(t.first))+'</span><span class="new">'+t.st[t.first]+'</span></li><li><span>'+esc(nice(t.last))+'</span><span class="new">'+t.st[t.last]+'</span></li></ul></div>';});
    d.removed.filter(x=>x.dir===dir).forEach(t=>{h+='<div class="chg"><h3>Train '+esc(t.no)+'<span class="chip del">Removed</span></h3><ul><li><span>'+esc(nice(t.first))+'</span><span class="old">'+t.st[t.first]+'</span></li><li><span>'+esc(nice(t.last))+'</span><span class="old">'+t.st[t.last]+'</span></li></ul></div>';});
    d.changed.filter(x=>x.dir===dir).forEach(t=>{
      h+='<div class="chg"><h3>Train '+esc(t.no)+'<span class="chip mod">'+t.ch.length+' stop'+(t.ch.length>1?'s':'')+'</span></h3><ul>'+t.ch.map(c=>{
        const dl=c.o&&c.n?toMin(c.n)-toMin(c.o):null;
        return '<li><span>'+esc(nice(c.s))+'</span><span>'+(c.o?'<span class="old">'+c.o+'</span> ':'<span class="delta">new stop</span> ')+(c.n?'→ <span class="new">'+c.n+'</span>':'→ <span class="delta">no longer stops</span>')+(dl!==null?' <span class="delta">('+(dl>0?'+':'')+dl+' min)</span>':'')+'</span></li>';}).join('')+'</ul></div>';
    });
  });
  return h;
}

/* ---------------- Standalone (local) storage ---------------- */
const LOCAL_KEY='ktmb-seremban-local-db';let LOCAL=null;
function localSave(){LOCAL.dirty=true;try{localStorage.setItem(LOCAL_KEY,JSON.stringify(LOCAL));}catch(e){}}
function localEmit(){
  S.revs=Object.entries(LOCAL.revisions).map(([id,d])=>({...d,_id:id}));S.revMap={};S.revs.forEach(r=>S.revMap[r._id]=r);
  S.live={...LOCAL.live};

function localDb(){
  return {doc(path){const[c,id]=path.split('/');return{
    set:async v=>{if(c==='config')LOCAL.live={...v};else LOCAL.revisions[id]=JSON.parse(JSON.stringify(v));localSave();localEmit();},
    delete:async()=>{if(c==='revisions')delete LOCAL.revisions[id];localSave();localEmit();}};}};
}
function exportLocal(){
  const now=new Date().toISOString();
  const out={exportedAt:now,live:Object.fromEntries(Object.entries(LOCAL.live).filter(([k])=>k!=='updatedAt')),
    revisions:Object.entries(LOCAL.revisions).map(([id,d])=>({_id:id,...d})).sort((a,b)=>a.n-b.n)};
  const blob=new Blob([JSON.stringify(out,null,1)+'\n'],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='timetable.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  // once this file is committed, the published snapshot will match these local edits
  LOCAL.base=now;LOCAL.dirty=false;try{localStorage.setItem(LOCAL_KEY,JSON.stringify(LOCAL));}catch(e){}
  S.admin.msg={kind:'ok',text:'Downloaded timetable.json. Replace seremban-timetable/data/timetable.json in the repo with it and commit, and everyone will see the update.'};renderAdmin();
}
function resetLocal(){
  try{localStorage.removeItem(LOCAL_KEY);}catch(e){}
  const snap=S.snapshot;
  LOCAL={base:snap.exportedAt,dirty:false,live:{...(snap.live||{})},revisions:Object.fromEntries((snap.revisions||[]).map(r=>{const{_id,...d}=r;return[_id,d];}))};
  localEmit();S.admin.msg={kind:'ok',text:'Local changes discarded. Showing the published timetable again.'};S.admin.confirmReset=false;renderAdmin();
}

/* ---------------- Boot ---------------- */
window.addEventListener('hashchange',()=>{S.admin.msg=null;render();window.scrollTo(0,0);});
render();
setInterval(()=>{if(view()==='rider'&&!busyUI()){const y=window.scrollY;renderRider();window.scrollTo(0,y);}},15000);
setInterval(tick,1000);
(async()=>{
  const c=window.claude;
  if(!c||!c.use){
    // Standalone (e.g. GitHub Pages): load the exported snapshot, and keep admin edits in this browser
    // until they are exported as timetable.json and committed to the repo.
    let snap;
    try{snap=await (await fetch('data/timetable.json',{cache:'no-cache'})).json();}
    catch(e){S.dbMissing=true;S.loaded=true;render();return;}
    S.localMode=true;S.canEdit=true;S.names.local='you (this browser)';S.snapshot=snap;
    let stored=null;try{stored=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');}catch(e){}
    if(stored&&stored.base!==snap.exportedAt) stored=null; // repo has a newer snapshot: drop stale local edits
    LOCAL=stored||{base:snap.exportedAt,dirty:false,live:{...(snap.live||{})},revisions:Object.fromEntries((snap.revisions||[]).map(r=>{const{_id,...d}=r;return[_id,d];}))};
    S.db=localDb();localEmit();S.loaded=true;render();return;
  }
  const [db,user,assets]=await Promise.all([c.use('db'),c.use('user'),c.use('assets')]);
  S.db=db;S.user=user;S.assets=assets;
  try{S.canEdit=user?!!(await user.canEdit()):false;}catch(e){}
  if(!db){S.dbMissing=true;S.loaded=true;render();return;}
  let gotRevs=false,gotLive=false;
  const timer=setTimeout(()=>{S.slow=true;render();},10000);
  const done=()=>{if(gotRevs&&gotLive){clearTimeout(timer);S.loaded=true;S.slow=false;}};
  db.collection('revisions').onSnapshot(snap=>{
    S.revs=snap.docs.map(d=>({...d.data(),_id:d.id}));S.revMap={};S.revs.forEach(r=>S.revMap[r._id]=r);
    if(!snap.metadata.fromCache){gotRevs=true;done();}
    if(view()==='rider')renderRider();else if(!S.admin.parsed)renderAdmin();
    resolveNames();
  },e=>{clearTimeout(timer);gotRevs=true;S.loaded=true;render();});
  db.doc('config/live').onSnapshot(snap=>{
    S.live=snap.exists?{...snap.data()}:{};
    if(!snap.metadata.fromCache){gotLive=true;done();}
    if(view()==='rider')renderRider();else if(!S.admin.parsed)renderAdmin();
  },e=>{clearTimeout(timer);gotLive=true;S.loaded=true;render();});
})();
</script>
